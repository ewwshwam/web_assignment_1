<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Registration</title>
</head>
<body>
  <h1>Student Registration Form</h1>
  <form action="#" method="post">
    <p>Name: <input type="text" name="name" placeholder="Full name"></p>
    <p>Password: <input type="password" name="pass"></p>
    <p>Email: <input type="email" name="email"></p>
    <p>Phone: <input type="tel" name="phone"></p>
    <p>Date of Birth: <input type="date" name="dob"></p>
    <p>Age: <input type="number" name="age" min="15" max="60"></p>
    <p>Gender:
      <input type="radio" name="gender" value="male"> Male
      <input type="radio" name="gender" value="female"> Female
      <input type="radio" name="gender" value="other"> Other
    </p>
    <p>Hobbies:
      <input type="checkbox" name="hobby" value="reading"> Reading
      <input type="checkbox" name="hobby" value="music"> Music
      <input type="checkbox" name="hobby" value="sports"> Sports
    </p>
    <p>Course:
      <select name="course">
        <option>MCA</option>
        <option>MBA</option>
        <option>BCA</option>
      </select>
    </p>
    <p>Address:<br><textarea name="address" rows="3" cols="30"></textarea></p>
    <p>Photo: <input type="file" name="photo"></p>
    <p>Favourite colour: <input type="color" name="color"></p>
    <input type="submit" value="Register">
    <input type="reset" value="Clear">
  </form>
</body>
</html>
