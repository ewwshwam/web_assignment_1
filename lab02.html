<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML Basics</title>
</head>
<body>
  <!-- This is a comment: it is not shown in the browser -->
  <h1>Heading 1</h1>
  <h2>Heading 2</h2>
  <h3>Heading 3</h3>
  <h4>Heading 4</h4>
  <h5>Heading 5</h5>
  <h6>Heading 6</h6>
  <hr>
  <p>This is the first paragraph. HTML stands for HyperText Markup Language.</p>
  <p>This is the second paragraph.<br>This line starts after a line break.</p>
  <hr>
  <p>End of page.</p>
</body>
</html>
