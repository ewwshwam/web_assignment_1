<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Images</title>
</head>
<body>
  <h1>Images Demo</h1>

  <h3>Normal and resized image</h3>
  <img src="images/photo.jpg" alt="Sample photo" width="300" height="200">

  <h3>Aligned image</h3>
  <img src="images/photo.jpg" alt="Right aligned" width="150" style="float:right">
  <p>This paragraph wraps around the image placed on the right side.</p>

  <h3 style="clear:both">Image as hyperlink</h3>
  <a href="https://www.wikipedia.org" target="_blank">
    <img src="images/logo.png" alt="Click to open Wikipedia" width="120">
  </a>

  <h3>Image gallery</h3>
  <img src="images/img1.jpg" alt="Image 1" width="200">
  <img src="images/img2.jpg" alt="Image 2" width="200">
  <img src="images/img3.jpg" alt="Image 3" width="200">
  <img src="images/img4.jpg" alt="Image 4" width="200">
</body>
</html>
