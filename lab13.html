<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Iframes</title>
</head>
<body>
  <h1>Iframe Demo</h1>

  <h3>Google Maps</h3>
  <iframe
    src="https://www.google.com/maps?q=Ichalkaranji&output=embed"
    width="500" height="300" style="border:0" loading="lazy"></iframe>

  <h3>Website</h3>
  <iframe src="https://www.wikipedia.org" width="500" height="300"
    title="Wikipedia"></iframe>

  <h3>YouTube Video</h3>
  <iframe width="500" height="300"
    src="https://www.youtube.com/embed/dQw4w9WgXcQ"
    title="YouTube video" allowfullscreen></iframe>
</body>
</html>
